<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>20 Rooms</title>
    <link rel="stylesheet" href="style.css">

    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <div id="room-counter">Room: 1/20</div>
        <div id="key-status" style="color: #666;">Key: Not Found</div>
    </div>
    <div id="message">Find the key to open the door</div>

    <!-- Start Menu -->
    <div id="start-menu">
        <h1>20 Rooms</h1>
        <p>A minimal liminal space simulator.</p>
        <p>PC: WASD to move, Mouse to look.</p>
        <p>Mobile: Left side to move, Right side to look.</p>
        <button id="start-btn">Start</button>
    </div>

    <!-- End Menu -->
    <div id="end-menu" style="display: none;">
        <h1>The End</h1>
        <p>You have passed through 20 rooms.</p>
    </div>

    <!-- Mobile Controls Overlay -->
    <div id="mobile-controls" style="display: none;">
        <div id="joystick-zone"></div>
        <div id="look-zone"></div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
